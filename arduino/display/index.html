<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werkstatt Display</title>
<style>
  :root { --navy:#0F2034; --cyan:#40A9DE; --hell:#E3EEF7; --grau:#595959; --gruen:#2e9e4f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:#fff; color:#222; }
  header { padding:16px 28px 0; border-bottom:4px solid var(--cyan); }
  .kopf { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { color:var(--navy); font-size:1.6rem; }
  header .sub { color:var(--grau); font-size:.95rem; }
  .modus { margin-left:auto; display:flex; gap:8px; }
  .modus button { font-size:1rem; padding:7px 18px; border:2px solid var(--cyan); background:#fff;
    color:var(--navy); border-radius:20px; cursor:pointer; font-weight:600; }
  .modus button.aktiv { background:var(--navy); color:#fff; border-color:var(--navy); }
  .reiter { display:flex; gap:4px; margin-top:12px; }
  .reiter button { font-size:1rem; padding:9px 20px; border:none; border-bottom:4px solid transparent;
    background:none; color:var(--grau); cursor:pointer; font-weight:600; margin-bottom:-4px; }
  .reiter button.aktiv { color:var(--navy); border-bottom-color:var(--navy); }
  main { display:flex; gap:24px; padding:20px 28px; align-items:flex-start; flex-wrap:wrap; }
  .bildbox { flex:0 0 auto; width:min(52vw, 580px); }
  @media (max-width: 860px) {
    main { padding:12px; gap:14px; }
    .bildbox { width:100%; max-width:520px; margin:0 auto; }
    header { padding:12px 14px 0; }
    header h1 { font-size:1.25rem; }
    .modus { margin-left:0; }
    .reiter { flex-wrap:wrap; gap:2px; }
    .reiter button { padding:8px 10px; font-size:.95rem; }
    .punkte span { width:20px; height:20px; }
  }
  svg.tafel { width:100%; height:auto; display:block; }
  .marke { cursor:pointer; }
  .marke .halo { stroke:#fff; stroke-width:6; }
  .marke .linie { stroke:var(--navy); stroke-width:1.8; }
  .marke .spitze { fill:var(--navy); }
  .marke .kreis { fill:var(--cyan); stroke:#fff; stroke-width:3; }
  .marke .rahmen { fill:rgba(64,169,222,0.06); stroke:var(--cyan); stroke-width:2.5; stroke-dasharray:7 5; }
  .marke:hover .rahmen { fill:rgba(64,169,222,0.16); }
  .marke.besucht .rahmen { stroke:var(--navy); }
  .marke.richtig .rahmen { stroke:var(--gruen); fill:rgba(46,158,79,0.14); }
  .marke .zahl { fill:#fff; font-weight:700; font-size:27px; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .marke:hover .kreis { stroke:var(--navy); }
  .marke.besucht .kreis { fill:var(--navy); }
  .marke.richtig .kreis { fill:var(--gruen); }
  .marke.richtig .linie { stroke:var(--gruen); }
  .marke.richtig .spitze { fill:var(--gruen); }
  .marke.falsch { animation:wackeln .35s; }
  @keyframes wackeln { 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  .info { flex:1 1 340px; min-width:300px; }
  .karte { background:var(--hell); border:2px solid var(--cyan); border-radius:14px; padding:20px 22px; }
  .karte .rolle { display:inline-block; background:var(--navy); color:#fff; font-size:.8rem; font-weight:700;
    letter-spacing:.4px; padding:4px 12px; border-radius:12px; margin-bottom:10px; }
  .karte h2 { color:var(--navy); font-size:1.35rem; margin-bottom:10px; }
  .karte p { font-size:1.05rem; line-height:1.55; }
  .karte .merke { margin-top:14px; padding:10px 14px; background:#fff; border-left:4px solid var(--cyan); font-size:.98rem; }
  .karte .merke b { color:var(--navy); }
  .fortschritt { margin-top:14px; color:var(--grau); font-size:.95rem; }
  .start-hinweis h2 { color:var(--navy); margin-bottom:8px; }
  .start-hinweis p { margin-bottom:8px; }
  #quizfrage { font-size:1.25rem; color:var(--navy); font-weight:700; margin-bottom:10px; }
  #quizhinweis { font-size:1rem; margin-top:10px; min-height:2.6em; }
  #quizstand { font-size:1.05rem; margin-top:10px; color:var(--grau); }
  .neustart { margin-top:14px; font-size:.95rem; padding:7px 16px; border:2px solid var(--cyan);
    background:#fff; color:var(--navy); border-radius:16px; cursor:pointer; font-weight:600; display:none; }
  .bau.neu { filter:drop-shadow(0 0 4px rgba(64,169,222,1)); }
  .schrittnav { display:none; margin-top:16px; gap:10px; align-items:center; flex-wrap:wrap; }
  .schrittnav button { font-size:1rem; padding:8px 18px; border:2px solid var(--cyan); background:#fff;
    color:var(--navy); border-radius:18px; cursor:pointer; font-weight:600; }
  .schrittnav button.vor { background:var(--navy); color:#fff; border-color:var(--navy); }
  .schrittnav button:disabled { opacity:.35; cursor:default; }
  .punkte { display:flex; gap:7px; margin-left:auto; }
  .punkte span { width:13px; height:13px; border-radius:50%; background:#c9d6e2; cursor:pointer; }
  .punkte span.an { background:var(--navy); }
  footer { padding:12px 28px 18px; color:var(--grau); font-size:.85rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  footer a { color:var(--grau); }
</style>
</head>
<body>
<header>
  <div class="kopf">
    <h1 id="titel">Der Arduino UNO — was sitzt wo?</h1>
    <span class="sub" id="unter">Klickt die Nummern an.</span>
    <div class="modus">
      <button id="btnErkunden" class="aktiv" onclick="setModus('erkunden')">Erkunden</button>
      <button id="btnQuiz" onclick="setModus('quiz')">Quiz</button>
    </div>
  </div>
  <div class="reiter" id="reiter"></div>
</header>
<main>
  <div class="bildbox">
    <svg class="tafel" viewBox="0 0 1000 900" id="tafel"></svg>
  </div>
  <div class="info">
    <div class="karte">
      <div class="start-hinweis" id="startText">
        <h2 id="startTitel"></h2>
        <p id="startText1"></p>
        <p>Klickt euch durch — und wechselt danach ins <b>Quiz</b>.</p>
      </div>
      <div id="teilAnzeige" style="display:none;">
        <span class="rolle" id="tRolle"></span>
        <h2 id="tName"></h2>
        <p id="tText"></p>
        <div class="merke" id="tMerke"></div>
        <div class="schrittnav" id="schrittNav">
          <button id="btnZurueck" onclick="schritt(-1)">&larr; Zurück</button>
          <button id="btnWeiter" class="vor" onclick="schritt(1)">Weiter &rarr;</button>
          <div class="punkte" id="punkte"></div>
        </div>
      </div>
      <div id="quizAnzeige" style="display:none;">
        <div id="quizfrage"></div>
        <p id="quizhilfe">Klickt die passende Nummer an.</p>
        <div id="quizhinweis"></div>
        <div id="quizstand"></div>
        <button class="neustart" id="btnNeustart" onclick="quizStart()">Noch einmal</button>
      </div>
      <div class="fortschritt" id="fortschritt"></div>
    </div>
  </div>
</main>
<footer>
  <span>Arduino: Temperatursteuerung · IAF51</span>
  <span>alle Zeichnungen: eigene</span>
</footer>

      {titel:"Installieren",text:"Ein Klick auf <b>INSTALLIEREN</b> — danach steht die Versionsnummer mit Haken daneben. Die Bibliothek liegt jetzt auf <b>diesem Laptop</b> und steht allen Sketchen zur Verfügung.",merke:"Einmal je Laptop — nicht für jeden Sketch neu."},
      {titel:"Ohne Internet: die ZIP-Datei",text:"Kein Internet? Dann liegt die Bibliothek als <b>ZIP-Datei</b> auf dem Laptop bereit: <b>Sketch → Bibliothek einbinden → .ZIP-Bibliothek hinzufügen</b> und die Datei auswählen. Das Ergebnis ist dasselbe wie über den Verwalter.",merke:"Der ZIP-Weg ist der Rückfall — merkt ihn euch für Räume ohne Internet."},
      {titel:"Die Beispiele öffnen",text:"Jede Bibliothek bringt <b>Beispielsketche</b> mit: <b>Datei → Beispiele → LiquidCrystal I2C → HelloWorld</b>. Dort steht funktionierender Code — ihr übernehmt daraus die Zeilen, die das Display ansprechen, in euren eigenen Sketch.",merke:"Beispiele sind eure Spickzettel: erst lesen, dann gezielt übernehmen."},
      {titel:"Prüfen: Der Fehler ist weg",text:"Noch einmal auf das <b>Häkchen</b> (nur prüfen): Die rote Meldung ist verschwunden, unten steht <b>„Kompilierung abgeschlossen“</b>. Jetzt kennt der Sketch alle Display-Befehle — welche das sind, zeigt die Tafel <b>„Die Befehle“</b>.",merke:"Eine Bibliothek ist fertiger Code für ein Bauteil, den wir mit #include in unseren Sketch holen."}
   ]},

   teile:[
      {id:'gndkabel',zx:280,zy:323,mx:300,my:40,name:"Das schwarze Kabel: GND an GND",rolle:"der Rückweg",text:"",merke:"Ohne GND fließt kein Strom — GND kommt immer zuerst."},
      {id:'vcc',zx:470,zy:352,mx:660,my:40,name:"Das rote Kabel: VCC an 5 V",rolle:"die Versorgung",text:"",merke:"Das Display läuft mit 5 V — so steht es im Datenblatt. Bleibt die Beleuchtung dunkel, prüft ihr zuerst VCC und GND."},
      {id:'sda',zx:266,zy:583,mx:80,my:700,name:"Das Kabel an SDA",rolle:"die Datenleitung",text:"",merke:"SDA überträgt die Daten. Zeigt das Display nur Kästchen oder nichts, sind SDA und SCL verdächtig — vertauscht oder lose."},
      {id:'scl',zx:376,zy:530,mx:300,my:690,name:"Das Kabel an SCL",rolle:"die Taktleitung",text:"",merke:"SCL gibt den Takt vor — ohne Takt kommt kein Datenbit an."},
      {id:'a4a5',box:[148,567.0,74,74],r:17,mx:114,my:604,name:"Die Pins A4 und A5",rolle:"der I2C-Bus des UNO",text:"",merke:"Auf dem UNO liegt SDA auf A4 und SCL auf A5. Dieselben Leitungen liegen zusätzlich auf den zwei Pins neben AREF — beides ist richtig."},
      {id:'rucksack',zx:700,zy:385,mx:940,my:100,name:"Das I2C-Modul",rolle:"der Übersetzer",text:"",merke:"Das Modul macht aus zwei Busleitungen die vielen Signale für die Anzeige. Darum reichen vier Kabel — und es hat eine Adresse auf dem Bus."},
      {id:'poti',zx:808,zy:338,mx:940,my:240,name:"Das Kontrast-Poti",rolle:"dreht die Lesbarkeit",text:"",merke:"Am Kontrast-Poti dreht ihr die Lesbarkeit. Hilft das nicht, passt im Sketch die Adresse nicht — das zeigt die Tafel „Die Befehle“."}
   ],
   quiz:[
      ["Die Beleuchtung bleibt dunkel — das schwarze GND-Kabel sitzt fest. Welche Leitung prüft ihr jetzt?", 'vcc'],
      ["Eine Gruppe hat VCC, SDA und SCL angeschlossen — trotzdem bleibt die Beleuchtung dunkel. Welches Kabel fehlt?", 'gndkabel'],
      ["Das Display zeigt nur schwarze Kästchen. Welche Datenleitung ist verdächtig?", 'sda'],
      ["Welche Leitung gibt den Takt für den Bus vor?", 'scl'],
      ["Eine Gruppe steckt SDA an den Pin neben AREF statt an A4. Funktioniert das? Klickt die Stelle, an der beide Leitungen zusammenlaufen.", 'a4a5'],
      ["Warum reichen vier Kabel für 32 Zeichen? Klickt den Baustein, der übersetzt.", 'rucksack'],
      ["Beleuchtung an, Verkabelung stimmt — trotzdem ist nichts zu lesen. An welchem Bauteil dreht ihr?", 'poti']
   ],kopf:"Das I2C-Display anschließen — Schritt für Schritt",
   schritte:[
      {titel:"Zuerst: USB ab",text:"Zieht das <b>USB-Kabel</b> ab — ihr baut <b>spannungsfrei</b> auf. Das gilt für jedes Bauteil, auch für das Display.",merke:"Auf- und Umbauen nur ohne USB."},
      {titel:"Das Display anschauen",text:"Dreht das Display um: Hinten sitzt das <b>I2C-Modul</b> mit einer Stiftleiste aus <b>vier Anschlüssen</b> — <b>GND</b>, <b>VCC</b>, <b>SDA</b> und <b>SCL</b>. Das Modul ist der <b>Übersetzer</b>: Es macht aus zwei Busleitungen die vielen Signale für die 32 Zeichen — darum reichen vier Kabel. Daneben sitzt das <b>Kontrast-Poti</b>: Daran dreht ihr, wenn später trotz Beleuchtung nichts zu lesen ist. Angeschlossen wird mit <b>Buchse-Stecker-Kabeln</b> direkt an den Arduino — ein Steckbrett braucht das Display nicht.",merke:"Vier Leitungen, vier Namen — die Platine sagt euch, welcher Stift welcher ist."},
      {titel:"GND an GND",text:"Das <b>schwarze</b> Kabel zuerst: vom <b>GND</b>-Stift des Moduls an einen <b>GND</b>-Pin der POWER-Leiste.",merke:"Schwarz ist GND — und GND kommt immer zuerst."},
      {titel:"VCC an 5 V",text:"Das <b>rote</b> Kabel: von <b>VCC</b> an den <b>5-V-Pin</b>. Die Versorgungsspannung des Displays steht im Datenblatt: <b>5 V DC</b> — genau das, was der UNO liefert.",merke:"Rot ist die Versorgung. Bleibt die Beleuchtung später dunkel: VCC und GND prüfen."},
      {titel:"SDA an A4 — die Daten",text:"Jetzt der Bus: <b>SDA</b> (Serial Data) ist die <b>Datenleitung</b>. Am UNO liegt sie auf <b>A4</b>. Über diese eine Leitung schickt der Sketch alles, was auf dem Display erscheinen soll.",merke:"Dieselbe Leitung liegt auch auf dem SDA-Pin neben AREF — zwei Steckstellen, ein Bus."},
      {titel:"SCL an A5 — der Takt",text:"<b>SCL</b> (Serial Clock) ist die <b>Taktleitung</b> — sie sagt, wann das nächste Bit gilt. Am UNO liegt sie auf <b>A5</b>. Damit ist das Display vollständig verbunden: zwei Leitungen Versorgung, zwei Leitungen Bus.",merke:"Wer den Bus nutzt, kann A4 und A5 nicht mehr zum Messen verwenden — der TMP36 bleibt auf A0."},
      {titel:"Nachfahren, dann USB",text:"Fahrt alle vier Leitungen mit dem Finger nach: <b>GND → GND · VCC → 5 V · SDA → A4 · SCL → A5</b>. Erst wenn eine zweite Person geprüft hat (Vier-Augen-Prüfung), kommt das USB-Kabel wieder dran. Ob das Display dann etwas anzeigt, entscheidet der Sketch — weiter auf der Tafel <b>„Die Befehle“</b>.",merke:"Vier Leitungen, vier Ziele — vertauschte Busleitungen zerstören nichts, aber es erscheint nichts."}
   ]},

      {id:'include',box:[60,140,360,26],r:17,mx:500,my:153,name:"#include",rolle:"holt die Bibliothek",text:"",merke:"Diese Zeile holt die Bibliothek in den Sketch — ohne sie kennt er keinen einzigen Display-Befehl. Meldet die IDE „No such file“, fehlt die Bibliothek oder ihr Name ist falsch geschrieben."},
      {id:'objekt',box:[60,191.0,400,26],r:17,mx:500,my:204,name:"Das Objekt lcd(0x27, 16, 2)",rolle:"Adresse und Größe",text:"",merke:"0x27 ist die Adresse auf dem Bus, 16 und 2 sind Spalten und Zeilen. Meldet sich nichts: Manche Module hören auf 0x3F."},
      {id:'initback',box:[60,267.5,220,52],r:17,mx:500,my:293,name:"lcd.init() und lcd.backlight()",rolle:"einschalten",text:"",merke:"Beide gehören in setup(): init() startet das Display, backlight() schaltet die Beleuchtung ein."},
      {id:'setcursor',box:[60,318.5,260,26],r:17,mx:500,my:328,name:"lcd.setCursor(0, 0)",rolle:"setzt die Stelle",text:"",merke:"setCursor(Spalte, Zeile) — gezählt ab 0: Spalten 0 bis 15, Zeilen 0 und 1. print schreibt ab genau dieser Stelle."},
      {id:'print',box:[60,344.0,300,26],r:17,mx:500,my:363,name:"lcd.print(\"Temperatur:\")",rolle:"schreibt auf das Display",text:"",merke:"print schreibt ab dem Cursor. Mehr als 16 Zeichen je Zeile passen nicht — der Rest fällt weg."},
      {id:'zeile2',box:[60,522.5,280,52],r:17,mx:500,my:548,name:"lcd.print(temperatur, 1)",rolle:"die Temperatur in Zeile 1",text:"",merke:"lcd.print(temperatur, 1) schreibt die Zahl mit einer Nachkommastelle — der Wert kommt aus der TMP36-Umrechnung."},
      {id:'reste',box:[60,573.5,240,26],r:17,mx:500,my:587,name:"lcd.print(\" C   \")",rolle:"überschreibt Reste",text:"",merke:"Das Display löscht nicht von selbst: Wird die Zahl kürzer, bleiben alte Zeichen stehen. Leerzeichen dahinter überschreiben sie."},
      {id:'display',zx:788,zy:222,mx:940,my:60,name:"Die Anzeige",rolle:"16 × 2 Zeichen",text:"",merke:"16 Spalten (0–15), 2 Zeilen (0 und 1) — mehr Platz gibt es nicht. Was nicht passt, wird abgeschnitten."}
   ],
   quiz:[
      ["Beim Prüfen: „No such file or directory“. Welche Zeile ist gemeint?", 'include'],
      ["Beleuchtung an, Verkabelung geprüft — trotzdem bleibt das Display leer. In welcher Zeile steckt der häufigste Fehler?", 'objekt'],
      ["Welche zwei Befehle wecken das Display auf und schalten die Beleuchtung ein?", 'initback'],
      ["Ihr wollt oben links beginnen — Spalte 0, Zeile 0. Welcher Befehl stellt das ein?", 'setcursor'],
      ["Welcher Befehl schreibt den Text „Temperatur:“ auf das Display?", 'print'],
      ["Aus 100.0 wird beim Abkühlen „99.90“ mit einer falschen 0 am Ende. Welche Zeile verhindert das?", 'reste'],
      ["Wie viel passt auf das Display? Klickt die Anzeige an.", 'display'],
      ["Die Temperatur soll mit einer Nachkommastelle erscheinen. Welche Zeilen schreiben sie?", 'zeile2']
   ],kopf:"Die Display-Befehle — Schritt für Schritt",
   schritte:[
      {titel:"#include — die Bibliothek holen",text:"Die erste Zeile holt die installierte Bibliothek in den Sketch: <code>#include &lt;LiquidCrystal_I2C.h&gt;</code>. Erst damit kennt der Sketch die Display-Befehle. Wie die Bibliothek auf den Laptop kommt, zeigt die Tafel <b>„Die Bibliothek“</b>.",merke:"Fehlt die Bibliothek oder stimmt der Name nicht, meldet die IDE „No such file or directory“."},
      {titel:"Das Objekt: lcd(0x27, 16, 2)",text:"Diese Zeile gibt eurem Display einen Namen im Sketch: <code>lcd</code>. Die drei Angaben: <b>0x27</b> ist die <b>Adresse</b> des Moduls auf dem I2C-Bus, <b>16</b> und <b>2</b> sind Spalten und Zeilen. Ab jetzt beginnt jeder Display-Befehl mit <code>lcd.</code>",merke:"Zeigt das Display trotz richtiger Kabel nichts: Manche Module hören auf die Adresse 0x3F statt 0x27."},
      {titel:"init() und backlight()",text:"In <code>setup()</code> wird das Display einmal gestartet: <code>lcd.init();</code> weckt es auf, <code>lcd.backlight();</code> schaltet die Beleuchtung ein. Rechts geht das Licht an — zu lesen gibt es noch nichts.",merke:"Ohne init() reagiert das Display gar nicht, ohne backlight() bleibt es dunkel — beide gehören in setup()."},
      {titel:"setCursor: die Stelle wählen",text:"<code>lcd.setCursor(0, 0);</code> setzt den unsichtbaren <b>Cursor</b>: erst die <b>Spalte</b> (0 bis 15), dann die <b>Zeile</b> (0 oder 1) — beide ab 0 gezählt. Geschrieben wird immer ab dieser Stelle.",merke:"setCursor(Spalte, Zeile) — Spalte zuerst, und gezählt wird ab 0."},
      {titel:"print: schreiben",text:"<code>lcd.print(\"Temperatur:\");</code> schreibt ab dem Cursor. Der Text steht in Anführungszeichen und bleibt stehen, bis etwas darüber geschrieben wird — deshalb reicht es, ihn einmal in <code>setup()</code> zu schreiben.",merke:"Eine Zeile fasst 16 Zeichen — was länger ist, fällt weg."},
      {titel:"Die zweite Zeile: die Temperatur",text:"In <code>loop()</code> kommt die Messung dazu — die bekannte Umrechnung vom TMP36: einlesen, zur Spannung, zur Temperatur. Dann: <code>lcd.setCursor(0, 1);</code> springt in Zeile 1, und <code>lcd.print(temperatur, 1);</code> schreibt den Wert mit <b>einer Nachkommastelle</b>.",merke:"print(zahl, 1) rundet auf eine Nachkommastelle — gut lesbar für den Kunden."},
      {titel:"Alte Reste überschreiben",text:"Das Display <b>löscht nicht von selbst</b>: Nach 100.0 zeigt eine kürzere Zahl wie 99.9 die alte 0 am Ende — es steht „99.90“ da. Die Lösung: <b>Leerzeichen hinter dem Wert</b> überschreiben die Reste — die Zeile dafür kommt im nächsten Schritt in den Sketch.",merke:"Leerzeichen hinter dem Wert löschen die Reste der alten Anzeige."},
      {titel:"Der ganze Sketch",text:"Die neue Zeile <code>lcd.print(\" C   \");</code> schreibt die Einheit und ein paar Leerzeichen hinter den Wert — die Rest-0 ist weg. Mit <code>delay(1000);</code> ist der Sketch fertig: Jede Sekunde misst der TMP36, der Sketch rechnet um, und das Display zeigt die Temperatur. Oben steht der Text aus <code>setup()</code>, unten der frische Wert aus <code>loop()</code>.",merke:"setup() schreibt, was stehen bleibt — loop() schreibt, was sich ändert."}
   ]},

   teile:[
      {id:'kopfzeilen',box:[54,133,332,52],r:17,mx:452,my:159,name:"Die zwei #include-Zeilen",rolle:"ganz oben",text:"",merke:"Beide ganz oben: Wire.h ist in der IDE schon eingebaut — nichts installieren. LiquidCrystal_I2C.h holt die installierte Display-Bibliothek in euren Sketch."},
      {id:'objekt',box:[54,310,332,30],r:17,mx:452,my:325,name:"Das Objekt lcd(0x27, 16, 2)",rolle:"ganz oben, vor setup()",text:"",merke:"Das Objekt steht ganz oben bei den Variablen — vor setup(). Was Adresse, 16 und 2 bedeuten, zeigt die Tafel „Die Befehle“."},
      {id:'setupneu',box:[54,466,248,96],r:17,mx:452,my:514,name:"Die vier neuen setup()-Zeilen",rolle:"laufen einmal",text:"",merke:"init, backlight, setCursor(0, 0) und der feste Text gehören in EUER setup() — unter die pinMode-Zeilen. Was einmal passieren und stehen bleiben soll, gehört in setup()."},
      {id:'loopneu',box:[54,735,248,68],r:17,mx:452,my:769,name:"Die drei neuen loop()-Zeilen",rolle:"laufen jede Sekunde",text:"",merke:"setCursor(0, 1), print(temperatur, 1) und die Leerzeichen kommen in EUREN loop() — nach der Umrechnung, denn sie brauchen die Variable temperatur."},
      {id:'bestand',box:[54,626,396,106],r:17,mx:500,my:679,name:"Euer Bestand (grau)",rolle:"bleibt unverändert",text:"",merke:"Messen, Umrechnen, LED-Kaskade, Serial — alles bleibt stehen. Die Display-Zeilen kommen nur dazu, nichts wird gelöscht."},
      {id:'kniff',box:[592,380,392,210],r:17,mx:956,my:404,name:"Der Variablen-Kniff",rolle:"sekunden wird temperatur",text:"",merke:"Im Beispiel heißt die Variable sekunden, bei euch temperatur. Fester Text steht in Anführungszeichen — Variablen ohne."},
      {id:'anzeige',zx:788,zy:222,mx:940,my:70,name:"Die Anzeige nach dem Hochladen",rolle:"der Föhntest",text:"",merke:"Oben der feste Text aus setup(), unten der frische Wert aus loop(). Beim Föhntest steigt die Zahl, die Ampel springt um — das Ergebnis kommt ins Logbuch."}

      ["Ihr übernehmt LiquidCrystal_I2C lcd(0x27, 16, 2); aus dem Beispiel. Wohin gehört die Zeile in eurem Sketch?", 'objekt'],

   schritte:[
      {titel:"Euer Sketch vom Freitag",text:"Links steht <b>euer Sketch vom Freitag</b> — grau, denn daran ändert ihr nichts: ganz oben die <b>Variablen</b>, dann <b>setup()</b> (läuft einmal), dann <b>loop()</b> (läuft immer wieder). Er misst, rechnet um, schaltet die LED-Kaskade und schickt Werte an den Monitor. Das Beispiel „Hallo Welt“ zeigt, wie das Display angesprochen wird — aber eure Messanlage steckt in <b>diesem</b> Sketch. Also holt ihr die Display-Zeilen <b>hierher</b>.",merke:"Nicht das Beispiel erweitern — die Display-Zeilen kommen in euren eigenen Sketch."},
      {titel:"Ganz oben: drei neue Zeilen",text:"Über eure Variablen kommen drei Zeilen aus dem Beispiel: <code>#include &lt;Wire.h&gt;</code> (in der IDE schon eingebaut — nichts installieren), <code>#include &lt;LiquidCrystal_I2C.h&gt;</code> (die installierte Display-Bibliothek) und das Objekt <code>LiquidCrystal_I2C lcd(0x27, 16, 2);</code>. Alle drei stehen <b>vor setup()</b>.",merke:"Was die drei Zeilen im Einzelnen bedeuten, zeigt die Tafel „Die Befehle“."},
      {titel:"In EUER setup(): vier Zeilen dazu",text:"In euer <code>setup()</code> kommen — unter die pinMode-Zeilen — vier Zeilen aus dem Beispiel: <code>lcd.init();</code>, <code>lcd.backlight();</code>, <code>lcd.setCursor(0, 0);</code> und <code>lcd.print(\"Temperatur:\");</code>. Alles, was <b>einmal</b> passieren und stehen bleiben soll. Euer <code>Serial.begin</code> und die pinMode-Zeilen bleiben unverändert davor.",merke:"setup() läuft einmal — der feste Text muss nur einmal geschrieben werden."},
      {titel:"In EUREN loop(): drei Zeilen dazu",text:"In euren <code>loop()</code> kommen — <b>nach der Umrechnung</b>, vor <code>delay(1000);</code> — drei Zeilen: <code>lcd.setCursor(0, 1);</code> springt in Zeile 1, <code>lcd.print(temperatur, 1);</code> schreibt den frischen Wert, <code>lcd.print(\" C   \");</code> hängt die Einheit an — die Leerzeichen überschreiben Reste der alten Zahl. Messung, Umrechnung, LED-Kaskade und <code>Serial.println</code> bleiben, wie sie sind.",merke:"Die neuen loop()-Zeilen brauchen die Variable temperatur — deshalb stehen sie NACH der Umrechnung."},
      {titel:"Der Variablen-Kniff",text:"Im Beispiel steht <code>lcd.print(sekunden);</code> — dort heißt die Variable <b>sekunden</b>. Bei euch heißt sie <b>temperatur</b>: Ihr schreibt also <code>lcd.print(temperatur, 1);</code>. Die Regel dahinter: <b>Fester Text</b> steht in <b>Anführungszeichen</b> — eine <b>Variable ohne</b>. Wer <code>lcd.print(\"temperatur\")</code> schreibt, sieht das Wort statt der Zahl.",merke:"Beim Übernehmen aus dem Beispiel: eure Variablennamen einsetzen — fester Text mit, Variablen ohne Anführungszeichen."},
      {titel:"Hochladen, Föhntest, Logbuch",text:"Erst das <b>Häkchen</b> (prüfen), dann der <b>Pfeil</b> (hochladen). Oben erscheint „Temperatur:“, unten der Messwert. Dann der <b>Föhntest</b>: Föhn auf den TMP36 — die Zahl steigt, die Ampel springt um. Das Ergebnis kommt <b>ins Logbuch</b>. Läuft etwas nicht, hilft die Tafel <b>„Wenn es nicht läuft“</b>.",merke:"Der Föhntest ist der Funktionsnachweis eurer Anlage — sein Ergebnis gehört ins Logbuch."}
   ]},

  const NS = 'http://www.w3.org/2000/svg';

  let tafel = TAFELN[0];
  let modus = 'erkunden';
  let besucht = {};
  let reihe = [], pos = 0, fehler = 0, geloest = false, warten = false;
  let schrittPos = {};                 // Tafeln mit Schritten merken sich, wo man war
  let letzter = {};                    // zuletzt angesehener Bereich je Tafel
  TAFELN.forEach(t => { besucht[t.id] = new Set(); schrittPos[t.id] = 0; });

  // Reiter aufbauen
  const reiterBox = document.getElementById('reiter');
  TAFELN.forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = t.titel;
    b.id = 'r_' + t.id;
    if (i === 0) b.className = 'aktiv';
    b.onclick = () => setTafel(t.id);
    reiterBox.appendChild(b);
  });

  function zeichneTafel() {
    const svg = document.getElementById('tafel');
    svg.innerHTML = tafel.svg;
    const g0 = document.createElementNS(NS, 'g');
    svg.appendChild(g0);
    tafel.teile.forEach((t, i) => {
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'marke');
      g.id = 'm_' + t.id;
      const r = t.r || 26;
      if (t.box) {
        // Rahmen statt Linie: In der IDE wuerde eine Linie Menue oder Code verdecken.
        const b = document.createElementNS(NS, 'rect');
        b.setAttribute('class', 'rahmen');
        b.setAttribute('x', t.box[0]); b.setAttribute('y', t.box[1]);
        b.setAttribute('width', t.box[2]); b.setAttribute('height', t.box[3]);
        b.setAttribute('rx', 6);
        g.appendChild(b);
      } else {
        const dx = t.zx - t.mx, dy = t.zy - t.my, len = Math.hypot(dx, dy);
        const x1 = t.mx + dx / len * r, y1 = t.my + dy / len * r;
        for (const klasse of ['halo', 'linie']) {
          const l = document.createElementNS(NS, 'line');
          l.setAttribute('class', klasse);
          l.setAttribute('x1', x1); l.setAttribute('y1', y1);
          l.setAttribute('x2', t.zx); l.setAttribute('y2', t.zy);
          g.appendChild(l);
        }
        const sp = document.createElementNS(NS, 'circle');
        sp.setAttribute('class', 'spitze');
        sp.setAttribute('cx', t.zx); sp.setAttribute('cy', t.zy); sp.setAttribute('r', 5.5);
        g.appendChild(sp);
      }
      const k = document.createElementNS(NS, 'circle');
      k.setAttribute('class', 'kreis');
      k.setAttribute('cx', t.mx); k.setAttribute('cy', t.my); k.setAttribute('r', r);
      g.appendChild(k);
      const z = document.createElementNS(NS, 'text');
      z.setAttribute('class', 'zahl');
      z.setAttribute('x', t.mx); z.setAttribute('y', t.my + 1);
      z.style.fontSize = Math.round(r * 1.04) + 'px';
      z.textContent = i + 1;
      g.appendChild(z);
      g.addEventListener('click', () => klick(t));
      g0.appendChild(g);
    });
  }

  function setTafel(id) {
    tafel = TAFELN.find(t => t.id === id);
    for (const t of TAFELN)
      document.getElementById('r_' + t.id).classList.toggle('aktiv', t.id === id);
    document.getElementById('titel').textContent = tafel.kopf || (tafel.titel + ' — was sitzt wo?');
    document.getElementById('unter').textContent = tafel.unter;
    document.getElementById('startTitel').textContent = tafel.titel;
    document.getElementById('startText1').textContent = tafel.unter;
    zeichneTafel();
    setModus(modus);
  }

  function zeige(idStr) {
    for (const s of ['startText', 'teilAnzeige', 'quizAnzeige'])
      document.getElementById(s).style.display = (s === idStr) ? 'block' : 'none';
  }

  function setModus(m) {
    modus = m;
    document.getElementById('btnErkunden').classList.toggle('aktiv', m === 'erkunden');
    document.getElementById('btnQuiz').classList.toggle('aktiv', m === 'quiz');
    for (const t of tafel.teile) {
      const g = document.getElementById('m_' + t.id);
      g.classList.remove('richtig', 'falsch');
      g.classList.toggle('besucht', m === 'erkunden' && besucht[tafel.id].has(t.id));
    }
    if (m === 'erkunden') {
      if (tafel.schritte) { zeigeSchritt(schrittPos[tafel.id]); return; }
      document.getElementById('schrittNav').style.display = 'none';
      // Karte immer neu fuellen - sonst steht dort noch der Inhalt einer anderen Tafel
      if (letzter[tafel.id]) erkunde(letzter[tafel.id]);
      else { zeige('startText'); fortschritt(); }
    } else {
      if (tafel.schritte) zeigeBau(null);
      quizStart();
    }
  }

  // ---- Tafeln mit Schritten: Der Aufbau waechst von Schritt zu Schritt ----
  // Jede Bauteilgruppe traegt data-s (ab welchem Schritt sie steckt) und
  // optional data-bis (bis zu welchem Schritt). Etiketten zeigen nur beim
  // eigenen Schritt, im Quiz nie - sonst stuende die Antwort daneben.
  function zeigeBau(k) {
    document.querySelectorAll('#tafel .bau').forEach(g => {
      const s = +g.dataset.s, bis = g.dataset.bis === undefined ? Infinity : +g.dataset.bis;
      const an = (k === null) ? bis === Infinity : (s <= k && k <= bis);
      g.style.display = an ? '' : 'none';
      g.classList.toggle('neu', k !== null && s === k);
    });
    document.querySelectorAll('#tafel .etikett').forEach(g => {
      g.style.display = (k !== null && +g.dataset.s === k) ? '' : 'none';
    });
    for (const t of tafel.teile)
      document.getElementById('m_' + t.id).style.display = (k === null) ? '' : 'none';
  }

  function zeigeSchritt(k) {
    const n = tafel.schritte.length;
    k = Math.max(0, Math.min(n - 1, k));
    schrittPos[tafel.id] = k;
    const s = tafel.schritte[k];
    zeigeBau(k);
    document.getElementById('tRolle').textContent = 'Schritt ' + (k + 1) + ' von ' + n;
    document.getElementById('tName').textContent = s.titel;
    document.getElementById('tText').innerHTML = s.text;
    const mk = document.getElementById('tMerke');
    mk.innerHTML = s.merke ? '<b>Merke:</b> ' + s.merke : '';
    mk.style.display = s.merke ? 'block' : 'none';
    document.getElementById('btnZurueck').disabled = (k === 0);
    document.getElementById('btnWeiter').innerHTML = (k === n - 1) ? 'Zum Quiz &rarr;' : 'Weiter &rarr;';
    const p = document.getElementById('punkte');
    p.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const d = document.createElement('span');
      if (i <= k) d.className = 'an';
      d.title = 'Schritt ' + (i + 1);
      d.onclick = () => zeigeSchritt(i);
      d.setAttribute('role', 'button');
      d.tabIndex = 0;
      d.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zeigeSchritt(i); } };
      p.appendChild(d);
    }
    document.getElementById('schrittNav').style.display = 'flex';
    document.getElementById('fortschritt').textContent = '';
    zeige('teilAnzeige');
  }

  function schritt(d) {
    const k = schrittPos[tafel.id] + d;
    if (k >= tafel.schritte.length) { setModus('quiz'); return; }
    zeigeSchritt(k);
  }

  document.addEventListener('keydown', e => {
    if (!tafel.schritte || modus !== 'erkunden') return;
    if (e.key === 'ArrowRight') schritt(1);
    if (e.key === 'ArrowLeft' && schrittPos[tafel.id] > 0) schritt(-1);
  });

  function klick(t) { modus === 'erkunden' ? erkunde(t) : quizKlick(t); }

  function erkunde(t) {
    document.getElementById('tMerke').style.display = 'block';
    besucht[tafel.id].add(t.id);
    letzter[tafel.id] = t;
    document.getElementById('m_' + t.id).classList.add('besucht');
    document.getElementById('tRolle').textContent = t.rolle;
    document.getElementById('tName').textContent = t.name;
    document.getElementById('tText').innerHTML = t.text;
    document.getElementById('tMerke').innerHTML = '<b>Merke:</b> ' + t.merke;
    zeige('teilAnzeige');
    fortschritt();
  }

  function fortschritt() {
    const n = besucht[tafel.id].size, g = tafel.teile.length;
    document.getElementById('fortschritt').textContent = modus === 'erkunden'
      ? n + ' von ' + g + ' Bereichen angesehen' + (n === g ? ' — alle durch! Jetzt das Quiz.' : '')
      : '';
  }

  function mischen(a) { return a.slice().sort(() => Math.random() - 0.5); }

  function quizStart() {
    const wo = mischen(tafel.teile).map(t => ({ frage: 'Wo sitzt: ' + t.name + '?', ziel: t.id }));
    reihe = wo.concat(mischen(tafel.quiz).map(a => ({ frage: a[0], ziel: a[1] })));
    pos = 0; fehler = 0; geloest = false; warten = false;
    document.getElementById('btnNeustart').style.display = 'none';
    document.getElementById('quizhilfe').style.display = 'block';
    document.getElementById('fortschritt').textContent = '';
    for (const t of tafel.teile)
      document.getElementById('m_' + t.id).classList.remove('richtig', 'falsch', 'besucht');
    zeige('quizAnzeige');
    quizFrage();
  }

  function quizFrage() {
    document.getElementById('quizfrage').textContent = reihe[pos].frage;
    document.getElementById('quizhinweis').textContent = '';
    document.getElementById('quizstand').textContent =
      'Frage ' + (pos + 1) + ' von ' + reihe.length + (fehler ? ' · Fehlversuche: ' + fehler : '');
  }

  function quizKlick(t) {
    if (geloest || warten) return;
    const g = document.getElementById('m_' + t.id);
    if (t.id === reihe[pos].ziel) {
      g.classList.add('richtig');
      document.getElementById('quizhinweis').innerHTML =
        '✔ Richtig! ' + tafel.teile.find(x => x.id === t.id).merke;
      pos++;
      if (pos >= reihe.length) {
        geloest = true;
        document.getElementById('quizfrage').textContent = 'Geschafft!';
        document.getElementById('quizhilfe').style.display = 'none';
        document.getElementById('quizstand').textContent =
          reihe.length + ' Fragen · ' + fehler + (fehler === 1 ? ' Fehlversuch' : ' Fehlversuche');
        document.getElementById('btnNeustart').style.display = 'inline-block';
      } else {
        warten = true;
        setTimeout(() => { g.classList.remove('richtig'); warten = false; quizFrage(); }, 1400);
      }
    } else {
      fehler++;
      g.classList.add('falsch');
      document.getElementById('quizhinweis').textContent =
        tafel.schritte
          ? '✘ Noch nicht — geht die Schritte im Erkunden-Modus noch einmal durch.'
          : '✘ Noch nicht — schaut euch den Bereich im Erkunden-Modus an.';
      document.getElementById('quizstand').textContent =
        'Frage ' + (pos + 1) + ' von ' + reihe.length + ' · Fehlversuche: ' + fehler;
      setTimeout(() => g.classList.remove('falsch'), 400);
    }
  }

  setTafel(TAFELN[0].id);
</script>
</body>
</html>
