<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automatisierungstechnik</title>
<style>
  :root { --navy:#0F2034; --cyan:#40A9DE; --hell:#E3EEF7; --grau:#595959; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:#222; font-family:'Segoe UI', system-ui, sans-serif;
    padding-inline:16px; }
  .kopf { max-width:860px; margin:0 auto; padding-block:26px 14px; border-bottom:4px solid var(--cyan); }
  .kopf .zurueck { font-size:.92rem; }
  .kopf a { color:var(--grau); }
  .kopf h1 { color:var(--navy); font-size:1.7rem; margin:6px 0 6px; }
  .kopf p { color:var(--grau); margin:0; font-size:1rem; }
  main { max-width:860px; margin:0 auto; padding-block:24px; display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:18px; }
  a.karte { display:block; background:var(--hell); border:1.75px solid var(--cyan); border-radius:14px;
    padding:20px 22px; text-decoration:none; color:#222; transition:transform .12s, box-shadow .12s; }
  a.karte:hover, a.karte:focus-visible { transform:translateY(-2px); box-shadow:0 4px 14px rgba(15,32,52,.14); }
  .karte .emoji { font-size:1.7rem; display:block; margin-bottom:8px; }
  .karte h2 { color:var(--navy); font-size:1.18rem; margin:0 0 6px; }
  .karte p { margin:0; font-size:.96rem; line-height:1.5; color:#333; }
</style>
</head>
<body>
<div class="kopf">
  <div class="zurueck"><a href="../">&larr; Werkzeugkasten</a></div>
  <h1>Automatisierungstechnik</h1>
  <p>Arduino-Projekte &middot; Temperatursteuerung</p>
</div>
<main>
  <a class="karte" href="lernwerkstatt.html">
    <span class="emoji">🤖</span>
    <h2>Lernwerkstatt Arduino</h2>
    <p>Board, IDE und Steckbrett zum Anklicken &ndash; und Schritt f&uuml;r Schritt eine LED mit Vorwiderstand anschlie&szlig;en. Mit Quiz zu jedem Bereich.</p>
  </a>
</main>
</body>
</html>
